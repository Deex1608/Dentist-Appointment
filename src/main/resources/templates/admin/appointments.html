<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Appointments – Admin – Dental Clinic</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<nav class="navbar navbar-admin">
    <div class="nav-brand">🦷 Dental Clinic Admin</div>
    <div class="nav-links">
        <a th:href="@{/admin/dashboard}">Dashboard</a>
        <a th:href="@{/admin/appointments}" class="active">Appointments</a>
        <a th:href="@{/admin/schedules}">Schedules</a>
        <a th:href="@{/admin/patients}">Patients</a>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <button type="submit" class="btn-link">Logout</button>
        </form>
    </div>
</nav>

<main class="main-content">
    <div class="page-header">
        <h1>All Appointments</h1>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

    <div class="filter-bar">
        <form th:action="@{/admin/appointments}" method="get">
            <div class="form-row" style="align-items:flex-end; gap:1rem">
                <div class="form-group" style="margin:0">
                    <label>Filter by Date</label>
                    <input type="date" name="date" class="form-control"
                           th:value="${selectedDate}"/>
                </div>
                <button type="submit" class="btn btn-secondary">Filter</button>
                <a th:href="@{/admin/appointments}" class="btn btn-link-style">Clear</a>
            </div>
        </form>
    </div>

    <div th:if="${appointments.isEmpty()}" class="empty-state">
        <p>No appointments found.</p>
    </div>

    <table th:unless="${appointments.isEmpty()}" class="data-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Date</th>
            <th>Time</th>
            <th>Patient</th>
            <th>Dentist</th>
            <th>Treatment</th>
            <th>Status</th>
            <th>Update Status</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="appt : ${appointments}">
            <td th:text="${appt.id}"></td>
            <td th:text="${appt.appointmentDate}"></td>
            <td th:text="${appt.appointmentTime}"></td>
            <td th:text="${appt.patient.fullName}"></td>
            <td th:text="${appt.dentist.fullName}"></td>
            <td th:text="${appt.treatmentType}"></td>
            <td><span class="badge" th:classappend="'badge-' + ${appt.status.name().toLowerCase()}"
                      th:text="${appt.status}"></span></td>
            <td>
                <form th:action="@{'/admin/appointments/' + ${appt.id} + '/status'}" method="post">
                    <select name="status" class="form-control form-control-sm">
                        <option th:each="s : ${T(com.dentist.appointment.model.AppointmentStatus).values()}"
                                th:value="${s}" th:text="${s}"
                                th:selected="${s == appt.status}"></option>
                    </select>
                    <button type="submit" class="btn btn-primary btn-sm" style="margin-top:4px">Save</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
