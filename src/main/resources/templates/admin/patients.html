<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Patient Records – Admin – Dental Clinic</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<nav class="navbar navbar-admin">
    <div class="nav-brand">🦷 Dental Clinic Admin</div>
    <div class="nav-links">
        <a th:href="@{/admin/dashboard}">Dashboard</a>
        <a th:href="@{/admin/appointments}">Appointments</a>
        <a th:href="@{/admin/schedules}">Schedules</a>
        <a th:href="@{/admin/patients}" class="active">Patients</a>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <button type="submit" class="btn-link">Logout</button>
        </form>
    </div>
</nav>

<main class="main-content">
    <div class="page-header">
        <h1>Patient Records</h1>
        <p class="subtitle" th:text="'Total: ' + ${patients.size()} + ' patients'"></p>
    </div>

    <div th:if="${patients.isEmpty()}" class="empty-state">
        <p>No patients registered yet.</p>
    </div>

    <table th:unless="${patients.isEmpty()}" class="data-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Date of Birth</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${patients}">
            <td th:text="${p.id}"></td>
            <td th:text="${p.fullName}"></td>
            <td th:text="${p.user.email}"></td>
            <td th:text="${p.phone != null ? p.phone : '-'}"></td>
            <td th:text="${p.dateOfBirth != null ? p.dateOfBirth : '-'}"></td>
            <td>
                <a th:href="@{'/admin/patients/' + ${p.id}}" class="btn btn-secondary btn-sm">View</a>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
