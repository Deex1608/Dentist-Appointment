<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Book Appointment – Dental Clinic</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<nav class="navbar">
    <div class="nav-brand">🦷 Dental Clinic</div>
    <div class="nav-links">
        <a th:href="@{/patient/dashboard}">Dashboard</a>
        <a th:href="@{/patient/appointments}">Appointments</a>
        <a th:href="@{/patient/book}" class="active">Book</a>
        <a th:href="@{/patient/profile}">Profile</a>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <button type="submit" class="btn-link">Logout</button>
        </form>
    </div>
</nav>

<main class="main-content">
    <div class="page-header">
        <h1>Book an Appointment</h1>
    </div>

    <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

    <div class="card" style="max-width:600px; margin:0 auto">
        <form th:action="@{/patient/book}" method="post">
            <div class="form-group">
                <label for="dentistId">Select Dentist</label>
                <select id="dentistId" name="dentistId" required class="form-control">
                    <option value="">-- Choose a dentist --</option>
                    <option th:each="d : ${dentists}" th:value="${d.id}"
                            th:text="${d.fullName + ' (' + d.specialization + ')'}"></option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="appointmentDate">Date</label>
                    <input type="date" id="appointmentDate" name="appointmentDate" required
                           th:min="${today}" class="form-control"/>
                </div>
                <div class="form-group">
                    <label for="appointmentTime">Time</label>
                    <select id="appointmentTime" name="appointmentTime" required class="form-control">
                        <option value="">-- Select time --</option>
                        <option value="09:00">09:00 AM</option>
                        <option value="09:30">09:30 AM</option>
                        <option value="10:00">10:00 AM</option>
                        <option value="10:30">10:30 AM</option>
                        <option value="11:00">11:00 AM</option>
                        <option value="11:30">11:30 AM</option>
                        <option value="13:00">01:00 PM</option>
                        <option value="13:30">01:30 PM</option>
                        <option value="14:00">02:00 PM</option>
                        <option value="14:30">02:30 PM</option>
                        <option value="15:00">03:00 PM</option>
                        <option value="15:30">03:30 PM</option>
                        <option value="16:00">04:00 PM</option>
                        <option value="16:30">04:30 PM</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="treatmentType">Treatment Type</label>
                <select id="treatmentType" name="treatmentType" required class="form-control">
                    <option value="">-- Select treatment --</option>
                    <option value="Routine Check-up">Routine Check-up</option>
                    <option value="Teeth Cleaning">Teeth Cleaning</option>
                    <option value="Cavity Filling">Cavity Filling</option>
                    <option value="Root Canal">Root Canal</option>
                    <option value="Tooth Extraction">Tooth Extraction</option>
                    <option value="Dental Crown">Dental Crown</option>
                    <option value="Braces Consultation">Braces Consultation</option>
                    <option value="Teeth Whitening">Teeth Whitening</option>
                    <option value="Pediatric Checkup">Pediatric Checkup</option>
                    <option value="Emergency Visit">Emergency Visit</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="notes">Notes (optional)</label>
                <textarea id="notes" name="notes" rows="3" class="form-control"
                          placeholder="Any additional information for the dentist..."></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Confirm Booking</button>
                <a th:href="@{/patient/appointments}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
