<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>My Appointments – Dental Clinic</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<nav class="navbar">
    <div class="nav-brand">🦷 Dental Clinic</div>
    <div class="nav-links">
        <a th:href="@{/patient/dashboard}">Dashboard</a>
        <a th:href="@{/patient/appointments}" class="active">Appointments</a>
        <a th:href="@{/patient/book}">Book</a>
        <a th:href="@{/patient/profile}">Profile</a>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <button type="submit" class="btn-link">Logout</button>
        </form>
    </div>
</nav>

<main class="main-content">
    <div class="page-header">
        <h1>My Appointments</h1>
        <a th:href="@{/patient/book}" class="btn btn-primary">+ Book New Appointment</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

    <div th:if="${appointments.isEmpty()}" class="empty-state">
        <p>No appointments found.</p>
        <a th:href="@{/patient/book}" class="btn btn-primary">Book an Appointment</a>
    </div>

    <table th:unless="${appointments.isEmpty()}" class="data-table">
        <thead>
        <tr>
            <th>Date</th>
            <th>Time</th>
            <th>Dentist</th>
            <th>Treatment</th>
            <th>Notes</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="appt : ${appointments}">
            <td th:text="${appt.appointmentDate}"></td>
            <td th:text="${appt.appointmentTime}"></td>
            <td th:text="${appt.dentist.fullName}"></td>
            <td th:text="${appt.treatmentType}"></td>
            <td th:text="${appt.notes != null ? appt.notes : '-'}"></td>
            <td><span class="badge" th:classappend="'badge-' + ${appt.status.name().toLowerCase()}"
                      th:text="${appt.status}"></span></td>
            <td>
                <form th:if="${appt.status.name() == 'PENDING' or appt.status.name() == 'CONFIRMED'}"
                      th:action="@{'/patient/appointments/' + ${appt.id} + '/cancel'}"
                      method="post"
                      onsubmit="return confirm('Cancel this appointment?')">
                    <button type="submit" class="btn btn-danger btn-sm">Cancel</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
