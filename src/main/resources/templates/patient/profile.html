<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>My Profile – Dental Clinic</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<nav class="navbar">
    <div class="nav-brand">🦷 Dental Clinic</div>
    <div class="nav-links">
        <a th:href="@{/patient/dashboard}">Dashboard</a>
        <a th:href="@{/patient/appointments}">Appointments</a>
        <a th:href="@{/patient/book}">Book</a>
        <a th:href="@{/patient/profile}" class="active">Profile</a>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <button type="submit" class="btn-link">Logout</button>
        </form>
    </div>
</nav>

<main class="main-content">
    <div class="page-header">
        <h1>My Profile</h1>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

    <div class="card" style="max-width:600px; margin:0 auto">
        <form th:action="@{/patient/profile}" method="post">
            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="firstName" required
                           th:value="${patient.firstName}" class="form-control"/>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="lastName" required
                           th:value="${patient.lastName}" class="form-control"/>
                </div>
            </div>

            <div class="form-group">
                <label>Email (read-only)</label>
                <input type="email" th:value="${patient.user.email}" disabled class="form-control"/>
            </div>

            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone"
                       th:value="${patient.phone}" class="form-control" placeholder="+1-555-0100"/>
            </div>

            <div class="form-group">
                <label for="dateOfBirth">Date of Birth</label>
                <input type="date" id="dateOfBirth" name="dateOfBirth"
                       th:value="${patient.dateOfBirth}" class="form-control"/>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" name="address"
                       th:value="${patient.address}" class="form-control" placeholder="Your address"/>
            </div>

            <div class="form-group">
                <label for="medicalHistory">Medical History / Allergies</label>
                <textarea id="medicalHistory" name="medicalHistory" rows="4" class="form-control"
                          placeholder="Any relevant medical history, allergies, or conditions..."
                          th:text="${patient.medicalHistory}"></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
        </form>
    </div>
</main>
</body>
</html>
